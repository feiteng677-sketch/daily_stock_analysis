name: Telegram Notify Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          {
            echo "=== getMe ==="
            curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe"
            echo ""
            echo "=== sendMessage ==="
            curl -s -m 25 -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"daily_stock_analysis: Telegram channel OK from GitHub runner.\"}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
            echo ""
          } | tee result.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-test
          path: result.txt
